name: Push

on:
  push:
    branches:
      - '**'
    tags:
      - '!**'

permissions: {}

jobs:
  # The build and lint jobs use the dependency cache, but they don't publish
  # anything. The docker and deploy workflows that do publish don't use it.
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.14
          cache: yarn # zizmor: ignore[cache-poisoning]
      - name: Install
        run: yarn --immutable
      - name: Build collaboration server
        run: yarn build
        working-directory: packages/apollo-collaboration-server
      - name: Build plugin
        run: JB_NPM=false yarn build
        working-directory: packages/jbrowse-plugin-apollo
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.14
          cache: yarn # zizmor: ignore[cache-poisoning]
      - name: Install
        run: yarn --immutable
        # Have to build shared before linting so type-based lint rules can
        # run correctly
      - name: Build shared
        run: yarn build
        working-directory: packages/apollo-shared
      - name: Lint codebase
        run: yarn eslint --max-warnings 0
      - name: Type check config files and scripts
        run: yarn typecheck:node
  docker:
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: write # push images to ghcr.io
    uses: ./.github/workflows/docker.yml
    with:
      tag: dev
  deploy:
    needs: [docker]
    if: ${{ github.ref == 'refs/heads/main' }}
    permissions:
      contents: read
      packages: read # pull images from ghcr.io
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
