name: Pull Request

on:
  pull_request:
    paths:
      - '**'
      - '!**.md'
      - '!**.mdx'
      - '!LICENSE'
      - '!.devcontainer/**'
      - '!.vscode/**'
      - '!.github/**'
      - '.github/workflows/pull_request.yml'

# Each job uploads its coverage reports to Codecov, and also as an artifact for
# running scripts/coverageMatrix.ts locally. Extract each artifact at the repo
# root to put the reports where the script expects them.

jobs:
  lint:
    name: Strict lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.14
          cache: yarn
      - name: Install
        run: yarn --immutable
      # Have to build shared before linting so type-based lint rules can
      # run correctly
      - name: Build shared
        run: yarn build
        working-directory: packages/apollo-shared
      - name: Lint codebase
        run: yarn eslint --max-warnings 0
      - name: Type check config files and scripts
        run: yarn typecheck:node

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.14
          cache: yarn
      - name: Install
        run: yarn --immutable
      - name: Build shared
        run: yarn build
        working-directory: packages/apollo-shared

      # apollo-shared tests
      - name: Run apollo-shared tests
        run: yarn run test:ci
        working-directory: packages/apollo-shared
      - name: Upload unit-shared coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/apollo-shared/coverage/lcov.info
          flags: unit-shared
          disable_search: true

      # apollo-cli unit tests
      - name: Run apollo-cli unit tests
        run: yarn run test:unit
        working-directory: packages/apollo-cli

      # apollo-plugin-example tests
      - name: Run apollo-plugin-example tests
        run: yarn run test:ci
        working-directory: packages/apollo-plugin-example

      # jbrowse-plugin-apollo tests
      - name: Run jbrowse-plugin-apollo tests
        run: yarn run test:ci
        working-directory: packages/jbrowse-plugin-apollo
      - name: Upload unit-plugin coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/jbrowse-plugin-apollo/coverage/lcov.info
          flags: unit-plugin
          disable_search: true

      # apollo-collaboration-server tests
      - name: Run apollo-collaboration-server tests
        run: yarn run test:ci
        working-directory: packages/apollo-collaboration-server
      - name: Upload unit-server coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: packages/apollo-collaboration-server/coverage/lcov.info
          flags: unit-server
          disable_search: true

      - name: Collect coverage reports
        if: ${{ !cancelled() }}
        run: |
          mkdir coverage-artifact
          cp --parents packages/*/coverage/lcov.info coverage-artifact/
      - name: Upload coverage reports artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage-artifact/
          if-no-files-found: warn

  e2e:
    name: Cypress tests
    # MongoDB 8 refuses to start on the ubuntu-24.04 runner's 7.0 kernel. Go
    # back to ubuntu-latest once MongoDB 8.0.35/8.3.14 are out.
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.14
          cache: yarn
      - name: Install
        run: yarn --immutable
      # Use the JBrowse build matching the @jbrowse/core version the plugin is
      # built against
      - name: Get JBrowse
        run: |
          version=$(yarn info @jbrowse/core --json | jq -r '.children.Version')
          yarn run jbrowse create --branch "v$version" .jbrowse
        working-directory: packages/jbrowse-plugin-apollo
      # The server seeds its assemblies from these config files at startup
      - name: Copy JBrowse test fixtures
        run: yarn run copy-jbrowse-test-fixtures
        working-directory: packages/jbrowse-plugin-apollo
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: 8
      - name: Start local file server
        id: file-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run:
          exec yarn --cwd packages/apollo-collaboration-server/test/data/ serve
          --listen 3131
      - name: Start plugin file server
        id: plugin-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run: exec yarn --cwd packages/jbrowse-plugin-apollo start:server
      - name: Start JBrowse file server
        id: jbrowse-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run: exec yarn --cwd packages/jbrowse-plugin-apollo browse
      # `exec` so the SIGTERM from `cancel` goes to yarn, which passes it on to
      # the server so it can write its coverage before exiting
      - name: Start apollo-collaboration-server
        id: apollo-collaboration-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run:
          exec yarn --cwd packages/apollo-collaboration-server
          cypress:start:coverage
      # Starting apollo builds shared and the server, so wait for it to finish
      # before the plugin build (which also builds shared)
      - name: Wait for servers to start
        run:
          timeout 300 bash -c 'until curl -sf http://localhost:3999/health &&
          curl -sf -o /dev/null http://localhost:9000 && curl -sf -o /dev/null
          http://localhost:8999; do sleep 2; done'
      - name: Run Cypress tests
        id: e2e-tests
        run: yarn run test:e2e:coverage
        working-directory: packages/jbrowse-plugin-apollo
      # Also uploaded when tests passed on a retry, to help debug flaky tests
      - name: Upload Cypress failure screenshots
        if: ${{ !cancelled() && steps.e2e-tests.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots
          path: packages/jbrowse-plugin-apollo/cypress/screenshots/
          if-no-files-found: ignore
      # Stop apollo before writing the coverage reports so its coverage is
      # written first
      - name: Stop apollo
        cancel: apollo-collaboration-server
      - name: Stop JBrowse file server
        cancel: jbrowse-server
      - name: Stop plugin file server
        cancel: plugin-server
      - name: Write e2e coverage reports
        id: e2e-coverage
        if:
          ${{ !cancelled() && steps.e2e-tests.outcome != 'skipped' &&
          hashFiles('packages/jbrowse-plugin-apollo/.nyc_output/**') != '' }}
        run: yarn run coverage:report:e2e
        working-directory: packages/jbrowse-plugin-apollo
      - name: Upload e2e coverage to Codecov
        if: ${{ !cancelled() && steps.e2e-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/e2e-browser/lcov.info,coverage/e2e-server/lcov.info
          flags: e2e
          disable_search: true
      - name: Stop local file server
        cancel: file-server
      - name: Collect coverage reports
        if: ${{ !cancelled() && steps.e2e-coverage.outcome == 'success' }}
        run: |
          mkdir coverage-artifact
          cp --parents coverage/e2e-*/lcov.info coverage-artifact/
      - name: Upload coverage reports artifact
        if: ${{ !cancelled() && steps.e2e-coverage.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-e2e
          path: coverage-artifact/
          if-no-files-found: warn

  e2e-plugin-example:
    name: Cypress tests (example plugin)
    # MongoDB 8 refuses to start on the ubuntu-24.04 runner's 7.0 kernel. Go
    # back to ubuntu-latest once MongoDB 8.0.35/8.3.14 are out.
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.14
          cache: yarn
      - name: Install
        run: yarn --immutable
      # Use the JBrowse build matching the @jbrowse/core version the plugin is
      # built against
      - name: Get JBrowse
        run: |
          version=$(yarn info @jbrowse/core --json | jq -r '.children.Version')
          yarn run jbrowse create --branch "v$version" .jbrowse
        working-directory: packages/jbrowse-plugin-apollo
      # The server creates the "example" assembly from these at startup
      - name: Copy JBrowse test fixtures
        run: yarn run copy-jbrowse-test-fixtures
        working-directory: packages/apollo-plugin-example
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: 8
      # The server loads the example's server bundle when it starts, so build
      # it first
      - name: Build example plugin
        run: yarn build
        working-directory: packages/apollo-plugin-example
      - name: Start example plugin file server
        id: example-plugin-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run: exec yarn --cwd packages/apollo-plugin-example serve:dist
      - name: Start plugin file server
        id: plugin-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run: exec yarn --cwd packages/jbrowse-plugin-apollo start:server
      - name: Start JBrowse file server
        id: jbrowse-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run: exec yarn --cwd packages/jbrowse-plugin-apollo browse
      - name: Wait for example plugin file server to start
        run:
          timeout 60 bash -c 'until curl -sf -o /dev/null
          http://localhost:3838/dist/server.bundle.js; do sleep 2; done'
      - name: Start apollo-collaboration-server
        id: apollo-collaboration-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run:
          exec yarn --cwd packages/apollo-collaboration-server
          cypress:start:example
      # Starting apollo builds shared and the server, so wait for it to finish
      # before the plugin build (which also builds shared)
      - name: Wait for servers to start
        run:
          timeout 300 bash -c 'until curl -sf http://localhost:3999/health &&
          curl -sf -o /dev/null http://localhost:9000 && curl -sf -o /dev/null
          http://localhost:8999; do sleep 2; done'
      - name: Build Apollo JBrowse plugin
        run: yarn build
        working-directory: packages/jbrowse-plugin-apollo
      - name: Run Cypress tests
        run: yarn cypress:run
        working-directory: packages/apollo-plugin-example
      - name: Upload Cypress screenshots
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: cypress-screenshots-plugin-example
          path: packages/apollo-plugin-example/cypress/screenshots/
          if-no-files-found: ignore
      - name: Stop apollo
        cancel: apollo-collaboration-server
      - name: Stop JBrowse file server
        cancel: jbrowse-server
      - name: Stop plugin file server
        cancel: plugin-server
      - name: Stop example plugin file server
        cancel: example-plugin-server

  cli:
    name: CLI tests
    # MongoDB 8 refuses to start on the ubuntu-24.04 runner's 7.0 kernel. Go
    # back to ubuntu-latest once MongoDB 8.0.35/8.3.14 are out.
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.14
          cache: yarn
      - name: Install
        run: yarn --immutable
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: 8
      - name: Start local file server
        id: file-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run:
          exec yarn --cwd packages/apollo-collaboration-server/test/data/ serve
          --listen 3131
      # `exec` so the SIGTERM from `cancel` goes to yarn, which passes it on to
      # the server so it can write its coverage before exiting
      - name: Start apollo-collaboration-server
        id: apollo-collaboration-server
        background: true
        # Exits non-zero when it's stopped
        continue-on-error: true
        run:
          exec yarn --cwd packages/apollo-collaboration-server
          test:cli:start:coverage
      # Starting apollo builds shared and the server, so wait for it to finish
      # before the CLI build
      - name: Wait for apollo to start
        run:
          timeout 300 bash -c 'until curl -sf http://localhost:3999/health; do
          sleep 2; done'
      # Checks that the packed CLI installs and runs. The full test suite runs
      # against the repo's build so its coverage maps back to the source.
      - name: Install CLI
        run: |
          yarn pack
          npm install --global package.tgz
          apollo --help
        working-directory: packages/apollo-cli
      - name: Run CLI tests
        id: cli-tests
        run: yarn run test:ci:coverage
        working-directory: packages/apollo-cli
      # Uses the same running server, so run it even if the CLI tests failed
      - name: Run server e2e tests
        if: ${{ !cancelled() }}
        run: yarn run test:e2e
        working-directory: packages/apollo-collaboration-server
      - name: Stop apollo-collaboration-server
        cancel: apollo-collaboration-server
      - name: Stop local file server
        cancel: file-server
      - name: Write CLI coverage report
        id: cli-coverage
        if: ${{ !cancelled() && steps.cli-tests.outcome != 'skipped' }}
        run: yarn run coverage:report
        working-directory: packages/apollo-cli
      - name: Upload cli coverage to Codecov
        if: ${{ !cancelled() && steps.cli-coverage.outcome == 'success' }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/cli/lcov.info
          flags: cli
          disable_search: true
      - name: Collect coverage reports
        if: ${{ !cancelled() && steps.cli-coverage.outcome == 'success' }}
        run: |
          mkdir coverage-artifact
          cp --parents coverage/cli/lcov.info coverage-artifact/
      - name: Upload coverage reports artifact
        if: ${{ !cancelled() && steps.cli-coverage.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-cli
          path: coverage-artifact/
          if-no-files-found: warn

  docker:
    name: Docker images
    # MongoDB 8 refuses to start on the ubuntu-24.04 runner's 7.0 kernel. Go
    # back to ubuntu-latest once MongoDB 8.0.35/8.3.14 are out.
    # https://github.com/actions/runner-images/issues/15005
    runs-on: ubuntu-22.04
    steps:
      - name: Check out
        uses: actions/checkout@v7
      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@v4
      - name: Build Collaboration Server image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: apollo-collaboration-server:test
          cache-from: type=gha,scope=collaboration-server
          cache-to: type=gha,mode=max,scope=collaboration-server
      # The published CLI image installs from npm, so test the one built from
      # the repo
      - name: Build CLI image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/apollo-cli/dev.Dockerfile
          load: true
          tags: apollo-cli:test
          cache-from: type=gha,scope=cli
          cache-to: type=gha,mode=max,scope=cli
      # The server creates its assemblies from the JBrowse config in
      # JBROWSE_DIR when it starts
      - name: Make JBrowse config
        run: |
          mkdir docker-jbrowse
          cp packages/apollo-collaboration-server/test/data/tiny.fasta* docker-jbrowse/
          cat > docker-jbrowse/config.json <<'EOF'
          {
            "assemblies": [
              {
                "name": "vv1",
                "sequence": {
                  "adapter": {
                    "type": "IndexedFastaAdapter",
                    "fastaLocation": { "uri": "tiny.fasta" },
                    "faiLocation": { "uri": "tiny.fasta.fai" }
                  }
                }
              }
            ]
          }
          EOF
      - name: Start MongoDB and apollo-collaboration-server
        run: |
          docker network create apollo
          docker run --detach --name mongo --network apollo mongo:8
          docker run --detach --name apollo --network apollo --publish 3999:3999 \
            --volume "$PWD/docker-jbrowse:/data/jbrowse" \
            --env JBROWSE_DIR=/data/jbrowse \
            --env NAME="Docker test" \
            --env URL=http://localhost:3999 \
            --env MONGODB_URI=mongodb://mongo:27017/apolloDb \
            --env FILE_UPLOAD_FOLDER=/data/uploads \
            --env JWT_SECRET=jwt-secret \
            --env SESSION_SECRET=session-secret \
            --env ALLOW_ROOT_USER=true \
            --env ROOT_USER_PASSWORD=pass \
            --env NO_COLOR=true \
            apollo-collaboration-server:test
      - name: Wait for apollo to start
        run:
          timeout 120 bash -c 'until curl -sf http://localhost:3999/health; do
          sleep 2; done'
      - name: Use the CLI image with the server
        run: |
          mkdir cli-config
          touch cli-config/config.yml
          apollo() {
            docker run --rm --network apollo \
              --volume "$PWD/cli-config:/root/.config/apollo-cli" \
              --volume "$PWD/packages/apollo-cli/test_data:/data" \
              apollo-cli:test "$@"
          }
          apollo config address http://apollo:3999
          apollo config accessType root
          apollo config rootPassword pass
          apollo login
          apollo assembly get --assembly vv1 | grep vv1
          apollo feature import /data/tiny.fasta.gff3 --assembly vv1
          apollo feature get --assembly vv1 | grep ctgA
      # The server exits with 0 when it shuts down cleanly on SIGTERM, and
      # Docker kills it (exit code 137) if it takes too long
      - name: Stop apollo-collaboration-server
        run: |
          docker stop apollo
          exit_code=$(docker inspect --format '{{.State.ExitCode}}' apollo)
          echo "Exit code: $exit_code"
          test "$exit_code" = 0
      - name: Show apollo-collaboration-server logs
        if: ${{ !cancelled() }}
        run: docker logs apollo
